<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plinth — signature demo: the allocation field</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fff; color: #1d1d1f; font: 13px/1.5 monospace; padding: 24px; }
  h1 { font-size: 14px; margin-bottom: 16px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .demo { display: flex; flex-direction: column; gap: 8px; }
  canvas { border: 1px solid #e5e6e8; border-radius: 28.8px; display: block; }
  #full { width: 720px; height: 440px; }
  #hero { width: 380px; height: 240px; }
  #empty { width: 380px; height: 180px; }
</style>
</head>
<body>
<h1>Allocation field — full (login) / hero (dashboard card) / empty state</h1>
<div class="row">
  <div class="demo"><span>full · 8 jobs · 41 allocated · 18 idle · 5 workshop</span><canvas id="full"></canvas></div>
  <div>
    <div class="demo"><span>hero · bounded card</span><canvas id="hero"></canvas></div>
    <br />
    <div class="demo"><span>empty · no assets registered</span><canvas id="empty"></canvas></div>
  </div>
</div>
<script type="module">
  import { createField } from "./js/signature.js";
  const jobs = [
    { code: "JOB-24-011", allocated: 9 }, { code: "JOB-24-014", allocated: 6 },
    { code: "JOB-24-017", allocated: 7 }, { code: "JOB-25-002", allocated: 4 },
    { code: "JOB-25-005", allocated: 5 }, { code: "JOB-25-008", allocated: 3 },
    { code: "JOB-25-011", allocated: 4 }, { code: "JOB-25-012", allocated: 3 },
  ];
  createField(document.getElementById("full"), {
    mode: "full", labels: true, seed: 11,
    data: { jobs: JSON.parse(JSON.stringify(jobs)), idle: 18, workshop: 5 },
  });
  createField(document.getElementById("hero"), {
    mode: "hero", seed: 4,
    data: { jobs: JSON.parse(JSON.stringify(jobs)).slice(0, 5), idle: 10, workshop: 3 },
  });
  createField(document.getElementById("empty"), { mode: "empty", seed: 2, data: { jobs: [], idle: 0, workshop: 0 } });
</script>
</body>
</html>
